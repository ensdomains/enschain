codecov:
  notify:
    # hold the report until every coverage job has uploaded, so a slow or
    # missing upload cannot grade the project against a partial report
    manual_trigger: true

coverage:
  status:
    project:
      default:
        # overall project/repo coverage
        target: 90%

flag_management:
  default_rules:
    carryforward: false
    statuses:
      - type: project
        target: auto
        threshold: 1%
        informational: true
      - type: patch
        target: 90%
        informational: true

comment:
  layout: "header, diff, flags, components, files"
  behavior: default
  require_changes: false # if true: only post the comment if coverage changes
  require_base: false # [true :: must have a base report to post]
  require_head: true # [true :: must have a head report to post]
  hide_project_coverage: false # [true :: only show coverage on the git diff aka patch coverage]

fixes:
  # "src/Something.sol" => "contracts/src/Something.sol"
  - "::contracts/"
